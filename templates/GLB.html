<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>R2Genius 3D Model Viewer</title>
    <script>
        window.CONFIG = {
            monsterModelNo: "{{ monstermodelno_result }}", // номер модели
            prefix: "{{ prefix|default('') }}", // префикс
            useClass: {{ use_class|default(0) }}, // класс
            dropEffect: {{ item.IDropEffect|default(0) if item else 0 }}, // эффект дропа
            baseUrl: "https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/",
            // Библиотеку просмотрщика (~300 КБ) грузим динамически из GLB.js,
            // уже после отрисовки страницы — чтобы не задерживать её показ
            viewerLib: "https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
        };
    </script>

    <script src="/static/bg/js/GLB.js" defer></script>
    <link rel="stylesheet" href="/static/bg/css/GLB.css">
</head>
<body>
    <div class="container" id="modelContainer">
        <model-viewer
            id="modelViewer"
            camera-controls
            autoplay
            alpha-mode="blend"
            shadow-intensity="1"
            exposure="0.5"
            shadow-softness="0.5"
            loading="lazy"
            environment-image="neutral"
            camera-orbit="180deg 75deg 105%"
            min-camera-orbit="auto auto auto"
            max-camera-orbit="auto auto 400%"
            interaction-prompt="auto"
            auto-rotate
            rotation-per-second="3deg"
            auto-rotate-delay="0"
            alt="R2 Online 3D model viewer with animation">
        </model-viewer>
        <button class="toggle-button toggle-menu" id="menuToggle">☰ Show Menu</button>
        <button class="toggle-button toggle-lock locked" id="lockToggle">🔓 Unlock</button>
        <div class="controls hidden">
            <div class="info" id="animInfo">Loading animations...</div>
            <div class="control-group animation-controls">
                <button id="playBtn">▶️</button>
                <button id="resetBtn">🔄</button>
            </div>
            <div class="control-group model-controls">
                <button id="prevModel" disabled>◀️</button>
                <button id="nextModel" disabled>▶️</button>
            </div>
            <div class="info" id="modelInfo">Animation: Loading...</div>
        </div>
    </div>
</body>
</html>
