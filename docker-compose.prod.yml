services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: r2wiki_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
      # Хост — LXC с 2 ГБ RAM без swap: жёстко ограничиваем аппетит SQL Server
      MSSQL_MEMORY_LIMIT_MB: "768"
    volumes:
      - db_data:/var/opt/mssql
      - ./docker_database:/var/opt/mssql/backup:ro
    # Restore выполняется в этом же контейнере после готовности sqlservr (restore.sql идемпотентен)
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &

      echo 'Waiting for SQL Server readiness...';
      until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1;
      do sleep 5; done;

      echo 'SQL is ready. Running restore...';
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /var/opt/mssql/backup/restore.sql;

      wait
      "
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    mem_limit: 1300m
    networks:
      - wiki_net
    restart: unless-stopped

  app:
    build: .
    container_name: r2wiki_flask
    environment:
      DB_DRIVER: "${DB_DRIVER}"
      DB_SERVER: "db"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      GITHUB_URL: "${GITHUB_URL}"
      PORT: "5000"
      PYTHONPATH: "/app"
      # Firebase Analytics — значения берутся из серверного .env;
      # дефолты пустые, чтобы compose не падал, пока они не заданы
      ENABLE_FIREBASE_ANALYTICS: "${ENABLE_FIREBASE_ANALYTICS:-false}"
      FIREBASE_API_KEY: "${FIREBASE_API_KEY:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_MEASUREMENT_ID: "${FIREBASE_MEASUREMENT_ID:-}"
      FIREBASE_APP_ID: "${FIREBASE_APP_ID:-}"
      FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN:-}"
      FIREBASE_STORAGE_BUCKET: "${FIREBASE_STORAGE_BUCKET:-}"
      FIREBASE_MESSAGING_SENDER_ID: "${FIREBASE_MESSAGING_SENDER_ID:-}"
      # Umami Analytics — аналогично, значения только в серверном .env
      ENABLE_UMAMI_ANALYTICS: "${ENABLE_UMAMI_ANALYTICS:-false}"
      UMAMI_SCRIPT_URL: "${UMAMI_SCRIPT_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
    healthcheck:
      # curl остался в образе после установки msodbcsql17
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    # Порт наружу не публикуем — доступ только через Caddy по сети proxy
    networks:
      - wiki_net
      - proxy
    restart: unless-stopped

networks:
  wiki_net:
  proxy:
    external: true

volumes:
  db_data:
