name: Deploy

on:
  push:
    branches:
      - deploy

# Не запускаем два деплоя одновременно
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Секреты живут в environment "production", у которого в настройках
    # разрешена только ветка deploy: ран с любой другой ветки/из PR
    # не получит ни окружения, ни секретов. Одобрение вручную не требуется.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Sync project files
        # .env и *.bak исключены из передачи, поэтому --delete их на сервере не тронет
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'logs' \
            --exclude '*.bak' \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.SERVER_PATH }}/"

      - name: Rebuild and restart app
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}" << 'EOF'
          set -e
          cd "${{ secrets.SERVER_PATH }}"
          docker compose -f docker-compose.prod.yml build app
          docker compose -f docker-compose.prod.yml up -d app
          docker image prune -f
          EOF

      - name: Wait for app health
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}" << 'EOF'
          for i in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' r2wiki_flask 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "App is healthy"
              exit 0
            fi
            echo "Health: $status, waiting... ($i/24)"
            sleep 5
          done
          echo "App failed to become healthy in time"
          docker logs --tail 50 r2wiki_flask
          exit 1
          EOF
